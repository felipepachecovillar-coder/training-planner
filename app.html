// ── Orden visual de días de semana ────────────────────────────────────────────
// dayOrder[pos] = id de día del plan (1..5) que se exhibe en la posición pos
// (0=Lunes..4=Viernes). No altera S.plan ni la planilla; es puramente de exhibición.
function daysAvail(){return Object.keys(S.plan).map(Number).sort((a,b)=>a-b);}
function defaultDayOrder(){const av=daysAvail();return WDS.map((_,i)=>av[i]??null);}
function getDayOrder(){
  const av=daysAvail();
  if(S.store["_dayOrder"])try{
    const o=JSON.parse(S.store["_dayOrder"]);
    if(Array.isArray(o)&&o.length===WDS.length&&o.every(d=>d===null||av.includes(d)))return o;
  }catch{}
  return defaultDayOrder();
}
function weekdayPosFor(d){const o=getDayOrder();const p=o.indexOf(d);return p<0?d-1:p;}
function swapDayOrder(posA,posB){
  const o=getDayOrder();
  if(posA===posB||o[posA]==null||o[posB]==null)return;
  [o[posA],o[posB]]=[o[posB],o[posA]];
  S.store["_dayOrder"]=JSON.stringify(o);
  saveStore();
}
function toggleReorder(){S.reorderMode=!S.reorderMode;S.swapPick=null;render();}
function tapDayTab(pos){
  if(!S.reorderMode){const o=getDayOrder();const d=o[pos];if(d)setDay(d);return;}
  if(S.swapPick===null){S.swapPick=pos;render();return;}
  if(S.swapPick===pos){S.swapPick=null;render();return;}
  swapDayOrder(S.swapPick,pos);S.swapPick=null;render();
}

function supersetParts(name){
  if(!name||name.indexOf("+")<0)return null;
  const ps=name.split("+").map(s=>s.trim()).filter(Boolean);
  return ps.length>=2?ps:null;
}
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function looksLikeExcelDate(v){
  const n=typeof v==="number"?v:parseFloat(String(v).replace(",","."));
  return Number.isFinite(n)&&n>=40000&&n<=60000&&Number.isInteger(n);
}
// parseFloat tolerante a coma decimal ("82,5" → 82.5). Retorna null si no es número.

}

async function fsGet(){
  try{
    const r=await fetch(FS+"/data?key="+FB_KEY);
    if(r.status===404)return{};
    if(!r.ok)return null;
    const j=await r.json();
    if(!j.fields)return{};
    const out={};
    for(const[k,v]of Object.entries(j.fields))
      out[k]=v.stringValue??String(v.integerValue??v.doubleValue??"");
    return out;
  }catch{return null;}
}
async function fsPut(data){
  const fields={};
  for(const[k,v]of Object.entries(data))fields[k]={stringValue:String(v)};
  try{
    const r=await fetch(FS+"/data?key="+FB_KEY,{
      method:"PATCH",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({fields})
    });
    if(r.status===404)
      await fetch(FS+"?documentId=data&key="+FB_KEY,{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({fields})
      });
  }catch{}
}

// ── Local + Cloud persistence ─────────────────────────────────────────────────
function loadLocal(){try{const r=localStorage.getItem(SK);if(r)S.store=JSON.parse(r);}catch{}}
function saveLocal(){try{localStorage.setItem(SK,JSON.stringify(S.store));}catch{}}
let _pendingFsPut=null;
function saveStore(){
  saveLocal();
  if(_pendingFsPut)clearTimeout(_pendingFsPut);
  _pendingFsPut=setTimeout(()=>{
    _pendingFsPut=null;
    const p={};
    for(const[k,v]of Object.entries(S.store))if(SYNC_PREFIX(k))p[k]=v;
    if(Object.keys(p).length)fsPut(p);
  },1500);
  _scheduleDriveUpload();
}
function applyCloud(data){
  S.store={...S.store,...data};
  saveLocal();
  if(data["_mesoList"])try{
    S.mesoList=JSON.parse(data["_mesoList"]);
    if(!S.mesoList.includes(S.meso))S.meso=S.mesoList[S.mesoList.length-1];
  }catch{}
  if(data["_mesoMeta"])try{
    S.mesoMeta=JSON.parse(data["_mesoMeta"]);
    const m=S.mesoMeta[S.meso];
    if(m?.planData)S.plan=m.planData;
  }catch{}
  if(data["_mesoWeeks"])try{S.mesoWeeks=JSON.parse(data["_mesoWeeks"]);}catch{}
  if(data["_driveFile"])try{S.driveFile=JSON.parse(data["_driveFile"]);}catch{}
  if(data["_sheetMap"])try{S.sheetMap=JSON.parse(data["_sheetMap"]);}catch{}
  if(data["_noteMap"])try{S.noteMap=JSON.parse(data["_noteMap"]);}catch{}
  if(data["_ssMap"])try{S.ssMap=JSON.parse(data["_ssMap"]);}catch{}
}
function updateSyncIcon(){
  const el=document.getElementById("syncIcon");
  if(!el)return;
  el.textContent=S.syncStatus==="ok"?"✓":S.syncStatus==="error"?"✕":"↻";
  el.style.color=S.syncStatus==="ok"?"#1D9E75":S.syncStatus==="error"?"#e24b4a":"#888";
}
const SYNC_PREFIX=k=>k.startsWith("kg-")||k.startsWith("note-")||k.startsWith("done-")||k.startsWith("dayname-")||k.startsWith("_meso")||k==="_driveFile"||k==="_dayOrder"||k==="_sheetMap"||k==="_noteMap"||k==="_ssMap"||k==="_driveMTime";
async function syncCloud(){
  if(S.syncing)return;
  // Hay ediciones locales esperando push (debounce): no aplicar nube para no pisarlas
  if(_pendingFsPut){updateSyncIcon();return;}
  S.syncing=true;S.syncStatus="syncing";updateSyncIcon();
  const data=await fsGet();
  let changed=false;
  if(data&&Object.keys(data).length>0){
    const before=JSON.stringify(S.store);
    applyCloud(data);
    normStore();
    if(JSON.stringify(S.store)!==before)changed=true;
    S.syncStatus="ok";
  }
  else if(data!==null){const p={};for(const[k,v]of Object.entries(S.store))if(SYNC_PREFIX(k))p[k]=v;if(Object.keys(p).length)await fsPut(p);S.syncStatus="ok";}
  else S.syncStatus="error";
  S.syncing=false;
  if(changed)render();else updateSyncIcon();
}

// ── Keys ──────────────────────────────────────────────────────────────────────
function kgKey(d,w,i,si){
  const base=S.meso==="1"?"kg-"+d+"-"+w+"-"+i:"kg-"+d+"-"+w+"-"+i+"-m"+S.meso;
  return si!==undefined?base+"-s"+si:base;
}
function noteKey(d,w,i){return"note-"+d+"-"+w+"-"+i+"-m"+S.meso;}
function doneKey(d,w){return"done-"+d+"-"+w+"-m"+S.meso;}
function dnameKey(d){return"dayname-"+S.meso+"-"+d;}
function getDayName(d){
  const c=S.store[dnameKey(d)];if(c)return c;
  const m=S.mesoMeta[S.meso];
  if(m?.dayNames?.[d])return m.dayNames[d];
  return DEFAULT_DAYNAMES[d-1]||"";
}
function getDayNameForMeso(d,mid){
  const c=S.store["dayname-"+mid+"-"+d];if(c)return c;
  const m=S.mesoMeta[mid];
  if(m?.dayNames?.[d])return m.dayNames[d];
  return DEFAULT_DAYNAMES[d-1]||"";
}

// ── Parser ────────────────────────────────────────────────────────────────────
// Soporta todos los formatos del Excel:
//   - Meso 1 viejo: Semana 1 | S2 | S3... (sin columna Carga)
//   - Meso 1 nuevo / 2-5: s1 | Carga s1 | s2 | Carga s2...
// Reglas:
//   1. "Día N" en cols 0-3 → nuevo bloque. typeName = col 0 de la fila siguiente
//      (que es la cabecera: "Upper Body", "Lower A", etc.)
//   2. Fila siguiente al "Día N" = cabecera de columnas → detectar weekCols
//   3. Fila con col 0 vacía → concatenar prescripción al ejercicio anterior (fila doble)
//   4. Fila con col 0 no vacía pero sin datos en ninguna semana → ignorar
//   5. Fila que es cabecera de tipo/fase → ignorar

function parseDayBlocks(rows){
  const days=[];
  let cur=null;
  let globalMaxWeek=0;

  // Regex para detectar nombres de fase/sección que NO son ejercicios
  const PHASE=/^(acumulac|intensific|descarga|taper|max.?week|pivot|acu\b|accesorios\b)/i;

  // Detectar columnas de semana en una fila cabecera
  // Retorna [{weekNum, presCol, loadCol}]
  function getWeekCols(hdr){
    const cols=[];
    for(let c=0;c<hdr.length;c++){
      const h=String(hdr[c]||"").trim().toLowerCase();
      // Acepta: s1, s2, s10, semana 1, semana 2
      const m=/^s(\d+)$/.exec(h)||/^semana\s*(\d+)/i.exec(h);
      if(!m)continue;
      const wNum=parseInt(m[1]);
      // Buscar "carga" inmediatamente a la derecha
      let lc=-1;
      for(let x=c+1;x<=c+2&&x<hdr.length;x++){
        if(/carga/i.test(String(hdr[x]||""))){lc=x;break;}
      }
      // Buscar "Observaciones" tras la carga (columna opcional, solo algunos mesos)
      let oc=-1;
      if(lc>=0)for(let x=lc+1;x<=lc+2&&x<hdr.length;x++){
        if(/observaci/i.test(String(hdr[x]||""))){oc=x;break;}
      }
      cols.push({weekNum:wNum,presCol:c,loadCol:lc,obsCol:oc});
    }
    // Formato "Semana 1" sin columna Carga — igual válido, loadCol=-1
    return cols;
  }

  // Para Meso 1: cabecera tiene "Semana 1" en col 6, "S2" en col 7...
  // pero el nombre del tipo de día está en col 0 de la cabecera (ej. "Pierna")
  // y nameCol=0. Los datos de cada semana = lo ejecutado (prescripción histórica).

  for(let r=0;r<rows.length;r++){
    const row=rows[r]||[];
    const c0=String(row[0]||"").trim();
    const c1=String(row[1]||"").trim();

    // ── ¿Es fila "Día N"? ────────────────────────────────────────────────
    // Buscar en cols 0-2
    let diaCol=-1, diaVal="";
    for(let c=0;c<=2;c++){
      const v=String(row[c]||"").trim();
      if(/^[Dd][íi]a\s*\d+/i.test(v)){diaCol=c;diaVal=v;break;}
    }

    if(diaCol>=0){
      if(cur)days.push(cur);

      // Cabecera = fila r+1
      const hdr=rows[r+1]||[];
      const weekCols=getWeekCols(hdr);
      weekCols.forEach(wc=>globalMaxWeek=Math.max(globalMaxWeek,wc.weekNum));

      // typeName = col diaCol de la cabecera (ej. "Upper Body")
      // Si es vacío o fase, buscar en la fila Día N después de diaCol
      let typeName=String(hdr[diaCol]||"").trim();
      if(!typeName||PHASE.test(typeName)){
        for(let c=diaCol+1;c<Math.min(row.length,diaCol+5);c++){
          const v=String(row[c]||"").trim();
          if(v&&!PHASE.test(v)&&!/^\d/.test(v)){typeName=v;break;}
        }
      }

      // Columnas auxiliares en cabecera (fallback a fila 0 del sheet para exports antiguos)
      let restCol=-1, detailsCol=-1;
      const scanHdr=h=>{
        for(let c=0;c<h.length;c++){
          const t=String(h[c]||"").trim().toLowerCase();
          if(restCol<0&&(t==="descanso"||t==="desc."))restCol=c;
          if(detailsCol<0&&t==="detalles")detailsCol=c;
        }
      };
      scanHdr(hdr);
      if(restCol<0||detailsCol<0)scanHdr(rows[0]||[]);

      cur={label:diaVal,typeName,nameCol:diaCol,
           headerRow:r+1,weekCols,restCol,detailsCol,exercises:[]};
      continue;
    }

    // Sin bloque activo o en cabecera → skip
    if(!cur||r<=cur.headerRow||!cur.weekCols.length)continue;

    const name=String(rows[r][cur.nameCol]||"").trim();

    // Concatenar una fila de continuación (fila doble) al último ejercicio
    const mergeCont=()=>{
      const prev=cur.exercises[cur.exercises.length-1];
      if(!prev)return;
      cur.weekCols.forEach(({weekNum,presCol,loadCol})=>{
        const wi=weekNum-1;
        if(wi>=prev.weeks.length)return;
        const pres=String(rows[r][presCol]||"").trim();
        if(pres&&pres!=="-"){
          prev.weeks[wi]=prev.weeks[wi]&&prev.weeks[wi]!=="-"
            ?prev.weeks[wi]+" / "+pres:pres;
        }
        if(loadCol>=0&&pres&&pres!=="-"){
          // Solo registrar celda de continuación si esta semana tiene prescripción
          // real (evita mapear filas de separación/encabezado como "fila doble").
          const lv=String(rows[r][loadCol]||"").trim();
          if(lv&&lv!=="0"){
            prev._extra=prev._extra||{};
            prev._extra[weekNum]=lv;
          }
          prev._extraCells=prev._extraCells||{};
          prev._extraCells[weekNum]={r,c:loadCol};
        }
      });
    };

    // ── Fila vacía en nameCol → concatenar al ejercicio anterior ─────────
    if(!name){mergeCont();continue;}

    // ── Ignorar filas de fase/sección (ANTES del check de datos) ─────────
    if(PHASE.test(name))continue;
    if(/^[Dd][íi]a\s*\d/i.test(name))continue;

    const hasData=cur.weekCols.some(({presCol})=>{
      const v=String(rows[r][presCol]||"").trim();
      return v&&v!=="-";
    });

    // ── Fila cuyo nameCol es un descanso (ej. "3min", "90 seg") ──────────
    const looksRest=/^\d[\d\s\-–,.]*\s*(seg|min)s?\.?$/i.test(name);
    if(looksRest){
      // Con datos en semanas → es la 2ª fila de un ejercicio doble: concatenar
      if(hasData&&cur.exercises.length){mergeCont();continue;}
      // Sin datos → descanso huérfano: ignorar
      if(!hasData)continue;
    }
    // Sin datos en ninguna semana y no es descanso: dejar pasar (comportamiento previo)

    // ── Construir semanas ─────────────────────────────────────────────────
    const nw=Math.max(globalMaxWeek,cur.weekCols.length,5);
    const weeks=Array.from({length:nw},(_,wi)=>{
      const wc=cur.weekCols.find(c=>c.weekNum===wi+1);
      if(!wc)return"-";
      const v=String(rows[r][wc.presCol]||"").trim();
      return v||"-";
    });

    const details=cur.detailsCol>=0?String(rows[r][cur.detailsCol]||"").trim():"";
    const rest=cur.restCol>=0?String(rows[r][cur.restCol]||"").trim():"";

    // Observaciones del entrenador por semana (columna opcional del Sheet)
    const obs={};
    cur.weekCols.forEach(({weekNum,obsCol})=>{
      if(obsCol>=0){const ov=String(rows[r][obsCol]||"").trim();if(ov)obs[weekNum]=ov;}
    });

    cur.exercises.push({name,details,rest,rowIdx:r,
      weekCols:cur.weekCols,weeks,_extra:{},_extraCells:{},obs});
  }
  if(cur)days.push(cur);
  days.detectedWeeks=globalMaxWeek||5;
  return days;
}

// ── Import ────────────────────────────────────────────────────────────────────
async function handleImport(file,opts={}){
  const silent=!!opts.silent;
  const _prevMeso=S.meso,_prevWeek=S.week,_prevDay=S.day,_prevView=S.view,_prevImportMsg=S.importMsg;
  const _snap=silent?{list:S.mesoList,meta:S.mesoMeta,weeks:S.mesoWeeks,map:S.sheetMap,nmap:S.noteMap,ssm:S.ssMap,plan:S.plan,store:JSON.stringify(S.store)}:null;
  const _restore=()=>{
    if(!_snap)return;
    S.mesoList=_snap.list;S.mesoMeta=_snap.meta;S.mesoWeeks=_snap.weeks;S.sheetMap=_snap.map;S.noteMap=_snap.nmap;S.ssMap=_snap.ssm;S.plan=_snap.plan;
    try{S.store=JSON.parse(_snap.store);}catch{}
    S.meso=_prevMeso;S.week=_prevWeek;S.day=_prevDay;S.view=_prevView;S.importMsg=_prevImportMsg;
  };
  try{
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:"array"});
    S.mesoList=[];S.mesoMeta={};S.mesoWeeks={};S.sheetMap={};S.noteMap={};S.ssMap={};

    wb.SheetNames.forEach((sn,si)=>{
      const mid=String(si+1);
      const ws=wb.Sheets[sn];
      // Offset del rango real: un Sheet nativo suele exportar empezando en B2, no A1.
      // sheet_to_json normaliza a índice 0, pero para ESCRIBIR de vuelta necesitamos
      // la coordenada absoluta. offR/offC = fila/columna donde arranca el contenido.
      let offR=0,offC=0;
      try{const rg=XLSX.utils.decode_range(ws["!ref"]||"A1");offR=rg.s.r;offC=rg.s.c;}catch{}
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
      const blocks=parseDayBlocks(rows);
      if(!blocks.length)return;

      S.mesoList.push(mid);
      S.mesoWeeks[mid]=blocks.detectedWeeks||5;

      // Limpiar cargas previas de ESTE meso (celda vacía en el Excel = sin carga).
      // No toca note-/done-: son datos del usuario, no provienen de la planilla.
      const kgPrefix=mid==="1"?/^kg-\d+-\d+-\d+(-s\d+)?$/:new RegExp("^kg-\\d+-\\d+-\\d+-m"+mid+"(-s\\d+)?$");
      for(const k of Object.keys(S.store))if(kgPrefix.test(k))delete S.store[k];

      const planData={},dayNames={},cellMap={},obsMap={},ssCells={};
      blocks.forEach((block,bi)=>{
        const dayId=bi+1;
        dayNames[dayId]=block.typeName||DEFAULT_DAYNAMES[bi]||"";
        planData[dayId]=block.exercises.map((ex,ei)=>{
          const ssParts=supersetParts(ex.name); // súper serie por "+" en el nombre
          // Guardar cargas fila 1 + registrar celda destino (aunque venga vacía)
          ex.weekCols.forEach(({weekNum,loadCol})=>{
            if(loadCol<0)return;
            const hasDouble=ex.weeks[weekNum-1]?.includes(" / ");
            const isSS=!!ssParts;
            const raw=rows[ex.rowIdx][loadCol];
            if(isSS){
              // Súper serie: una celda con dos pesos "20 / 15" → s0/s1 misma celda.
              const cellRef=(ex.rowIdx+offR)+","+(loadCol+offC);
              cellMap[dayId+"-"+weekNum+"-"+ei+"-s0"]=cellRef;
              cellMap[dayId+"-"+weekNum+"-"+ei+"-s1"]=cellRef;
              ssCells[dayId+"-"+weekNum+"-"+ei]=true; // marca para concatenar al escribir
              if(!looksLikeExcelDate(raw)){
                const txt=String(raw||"").trim();
                if(txt&&txt!=="0"){
                  const p=txt.split("/").map(s=>s.trim());
                  const base=mid==="1"?"kg-"+dayId+"-"+weekNum+"-"+ei:"kg-"+dayId+"-"+weekNum+"-"+ei+"-m"+mid;
                  if(p[0])S.store[base+"-s0"]=p[0];
                  if(p[1])S.store[base+"-s1"]=p[1];
                }
              }
              return;
            }
            const ck=dayId+"-"+weekNum+"-"+ei+(hasDouble?"-s0":"");
            cellMap[ck]=(ex.rowIdx+offR)+","+(loadCol+offC);
            if(looksLikeExcelDate(raw))return;
            const val=String(raw||"").trim();
            if(!val||val==="0")return;
            const base=mid==="1"
              ?"kg-"+dayId+"-"+weekNum+"-"+ei
              :"kg-"+dayId+"-"+weekNum+"-"+ei+"-m"+mid;
            S.store[hasDouble?base+"-s0":base]=val;
          });
          // Celdas destino fila 2
          Object.entries(ex._extraCells||{}).forEach(([wn,cell])=>{
            cellMap[dayId+"-"+wn+"-"+ei+"-s1"]=(cell.r+offR)+","+(cell.c+offC);
          });
          // Guardar cargas fila 2
          Object.entries(ex._extra||{}).forEach(([wn,val])=>{
            const base=mid==="1"
              ?"kg-"+dayId+"-"+wn+"-"+ei
              :"kg-"+dayId+"-"+wn+"-"+ei+"-m"+mid;
            S.store[base+"-s1"]=val;
          });
          // Observaciones: registrar celda destino (para escritura) y sembrar la
          // nota del coach SOLO si el usuario no tiene ya una nota propia ahí.
          // noteKey siempre usa -m{mid} (incluso meso 1).
          ex.weekCols.forEach(({weekNum,obsCol})=>{
            if(obsCol<0)return;
            obsMap[dayId+"-"+weekNum+"-"+ei]=(ex.rowIdx+offR)+","+(obsCol+offC);
            const nk="note-"+dayId+"-"+weekNum+"-"+ei+"-m"+mid;
            const coachNote=(ex.obs||{})[weekNum];
            if(coachNote&&!S.store[nk])S.store[nk]=coachNote; // app manda: no pisa lo tuyo
          });
          return{name:ex.name,details:ex.details,rest:ex.rest,weeks:ex.weeks};
        });
      });
      S.mesoMeta[mid]={sheetName:sn,planData,dayNames};
      // Solo habilitar escritura (sheetMap) si el meso tiene columnas "Carga" reales.
      // Se exige que la mayoría de columnas de semana tengan su par de carga, para
      // descartar formatos legados donde una columna suelta da falso positivo.
      // Sin esto, el sync podría sobrescribir celdas incorrectas del entrenador.
      let wcTot=0,wcLoad=0;
      blocks.forEach(b=>(b.weekCols||[]).forEach(w=>{wcTot++;if(w.loadCol>=0)wcLoad++;}));
      const hasLoadCols=wcTot>0&&wcLoad>=wcTot*0.5;
      S.sheetMap[mid]=hasLoadCols?cellMap:{};
      // Mapa de celdas de observaciones (para escritura app→Sheet). Mismo guard.
      S.noteMap[mid]=hasLoadCols?obsMap:{};
      S.ssMap[mid]=hasLoadCols?ssCells:{};
    });

    if(!S.mesoList.length){
      if(silent){_restore();render();return;}
      S.importMsg="err:No se encontraron días.";render();return;
    }
    if(silent&&S.mesoList.includes(_prevMeso)){
      S.meso=_prevMeso;S.week=Math.min(_prevWeek,S.mesoWeeks[_prevMeso]||5);S.day=_prevDay;S.view=_prevView;
    }else{
      S.meso=S.mesoList[S.mesoList.length-1];
    }
    S.plan=S.mesoMeta[S.meso].planData;

    const mm={};
    S.mesoList.forEach(mid=>{
      const m=S.mesoMeta[mid];
      if(m)mm[mid]={sheetName:m.sheetName,planData:m.planData,dayNames:m.dayNames};
    });
    S.store["_mesoList"]=JSON.stringify(S.mesoList);
    S.store["_mesoMeta"]=JSON.stringify(mm);
    S.store["_mesoWeeks"]=JSON.stringify(S.mesoWeeks);
    S.store["_sheetMap"]=JSON.stringify(S.sheetMap);
    S.store["_noteMap"]=JSON.stringify(S.noteMap);
    S.store["_ssMap"]=JSON.stringify(S.ssMap);
    saveStore();
    if(!silent)S.importMsg="ok:✓ "+file.name+" — "+S.mesoList.length+" mesociclo(s)";
  }catch(e){
    if(silent)_restore();
    else S.importMsg="err:Error: "+e.message;
  }
  render();
}

// ── Export ────────────────────────────────────────────────────────────────────
function buildWorkbook(){
  const list=S.mesoList.length?S.mesoList:["1"];
  const wb=XLSX.utils.book_new();
  list.forEach(mid=>{
    const meta=S.mesoMeta[mid]||{sheetName:"Meso "+mid,planData:DEFAULT,dayNames:{}};
    const nw=S.mesoWeeks[mid]||10;
    const wsData=[];
    const hdr=["Ejercicio","Detalles","Descanso"];
    for(let w=1;w<=nw;w++)hdr.push("S"+w,"Carga S"+w);
    wsData.push(hdr);
    for(let d=1;d<=5;d++){
      const exs=meta.planData[d]||[];
      const dayRow=["Día "+d,getDayNameForMeso(d,mid)];
      for(let w=1;w<=nw;w++)dayRow.push("","");
      wsData.push(dayRow);
      const subHdr=["","Detalles","Descanso"];
      for(let w=1;w<=nw;w++)subHdr.push("S"+w,"Carga S"+w);
      wsData.push(subHdr);
      exs.forEach((ex,ei)=>{
        const row=[ex.name,ex.details,ex.rest];
        const row2=["","",""];
        let hasRow2=false;
        for(let w=1;w<=nw;w++){
          const pres=ex.weeks?.[w-1]||"-";
          const parts=pres.includes(" / ")?pres.split(" / "):[pres];
          const base=mid==="1"?"kg-"+d+"-"+w+"-"+ei:"kg-"+d+"-"+w+"-"+ei+"-m"+mid;
          if(parts.length>1){
            hasRow2=true;
            row.push(parts[0],S.store[base+"-s0"]||"");
            row2.push(parts[1],S.store[base+"-s1"]||"");
          }else{
            row.push(pres,S.store[base]||"");
            row2.push("","");
          }
        }
        wsData.push(row);
        if(hasRow2)wsData.push(row2);
      });
      wsData.push([]);
    }
    const ws=XLSX.utils.aoa_to_sheet(wsData);
    XLSX.utils.book_append_sheet(wb,ws,meta.sheetName||"Meso "+mid);
  });
  return wb;
}

function handleExport(){
  const wb=buildWorkbook();
  const fname="training_export_"+new Date().toISOString().slice(0,10)+".xlsx";
  XLSX.writeFile(wb,fname);
  S.importMsg="ok:✓ Exportado como "+fname;
  render();
}

// ── Progress ──────────────────────────────────────────────────────────────────
function buildDatasets(){
  const exs=S.plan[S.day]||[];
  const exName=exs[S.progEx]?.name;
  if(!exName)return[];
  return S.mesoList.map((mid,mi)=>{
    const nw=S.mesoWeeks[mid]||5;
    const mExs=S.mesoMeta[mid]?.planData?.[S.day]||[];
    const exIdx=mExs.findIndex(e=>e.name===exName);
    const data=Array.from({length:nw},(_,wi)=>{
      if(exIdx<0)return null;
      const base=mid==="1"
        ?"kg-"+S.day+"-"+(wi+1)+"-"+exIdx
        :"kg-"+S.day+"-"+(wi+1)+"-"+exIdx+"-m"+mid;
      const v1=num(S.store[base]);
      return v1!==null&&v1!==0?v1:(num(S.store[base+"-s0"])??null);
    });
    return{label:"Meso "+Number(mid),data,color:MC[mi%6],weeks:nw};
  });
}

// ── Pantalla inicial: ¿en qué semana estás? ───────────────────────────────────
function _lastPos(){
  try{const p=JSON.parse(S.store["_lastPos"]||"{}");return{meso:p.meso||"",week:+p.week||0};}
  catch{return{meso:"",week:0};}
}
function _savePos(){S.store["_lastPos"]=JSON.stringify({meso:S.meso,week:S.week});saveLocal();}
function startSelMeso(m){S.startMeso=m;render();}

function chooseStart(mid,w){
  if(mid&&S.mesoList.includes(mid)){
    S.meso=mid;
    const mm=S.mesoMeta[mid];
    if(mm?.planData)S.plan=mm.planData;
  }
  if(w)S.week=Math.min(w,S.mesoWeeks[S.meso]||5);
  // Día según el día de la semana actual (Lun–Vie), respetando el orden visual
  const wd=new Date().getDay();
  const pos=(wd>=1&&wd<=5)?wd-1:0;
  let d=getDayOrder()[pos];
  if(!d||!S.plan[d]){const ks=Object.keys(S.plan);if(ks.length)d=+ks[0];}
  S.day=d;S.view="workout";S.exp=null;S.askStart=false;
  _savePos();render();
}

function renderStart(){
  const lp=_lastPos();
  const mid=S.startMeso||(S.mesoList.includes(lp.meso)?lp.meso:S.mesoList[S.mesoList.length-1]);
  const nw=S.mesoWeeks[mid]||5;
  const WEEKS=weeksFor(nw);
  const last=S.mesoList[S.mesoList.length-1];
  return '<div style="max-width:520px;margin:0 auto;padding:2.5rem 16px">'
    +'<h2 style="font-size:20px;margin:0 0 4px">¿En qué semana estás?</h2>'
    +'<p style="color:#888;font-size:13px;margin:0 0 18px">Elige el mesociclo y la semana para ir directo al entrenamiento.</p>'
    +'<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">'
    +S.mesoList.map(m=>'<button onclick="startSelMeso(&quot;'+m+'&quot;)" style="padding:6px 14px;border-radius:16px;font-size:12px;cursor:pointer;border:1px solid '+(m===mid?'#378ADD':'#ccc')+';background:'+(m===mid?'#378ADD':'transparent')+';color:'+(m===mid?'#fff':'#555')+'">Meso '+Number(m)+(m===last?' ★':'')+'</button>').join('')
    +'</div>'
    +'<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px">'
    +WEEKS.map(w=>{
      const c=PC[w.phase]||"#378ADD";
      const sel=(mid===lp.meso&&w.id===lp.week);
      return '<button onclick="chooseStart(&quot;'+mid+'&quot;,'+w.id+')" title="'+w.phase+'" '
        +'style="padding:14px 0;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;'
        +'border:'+(sel?'2px solid '+c:'1px solid #ddd')+';background:'+c+'18;color:'+c+'">'
        +w.label+'</button>';
    }).join('')
    +'</div>'
    +'<div style="margin-top:16px;text-align:center"><a href="#" onclick="chooseStart(null,null);return false" style="font-size:13px;color:#888">Cerrar</a></div>'
    +'</div>';
}

// ── Render ────────────────────────────────────────────────────────────────────
function render(){
  if(S.askStart&&S.mesoList.length){document.getElementById("app").innerHTML=renderStart();return;}
  const nw=S.mesoWeeks[S.meso]||5;
  const WEEKS=weeksFor(nw);
  if(S.week>nw)S.week=nw;
  const wk=WEEKS[S.week-1];
  const pc=PC[wk.phase]||"#378ADD";
  const exs=S.plan[S.day]||[];
  const isDone=isDoneVal(S.store[doneKey(S.day,S.week)]);
  const v=S.view;

  let html='<div class="hdr">'
    +'<div><span style="font-weight:500;font-size:16px">Training Planner</span>'
    +'<span style="font-size:12px;color:#888;margin-left:8px">Felipe Pacheco</span></div>'
    +'<div style="display:flex;align-items:center;gap:8px">'
    +'<button id="syncIcon" onclick="syncCloud()" style="border:none;background:transparent;cursor:pointer;font-size:16px;padding:2px 4px;color:'
    +(S.syncStatus==="ok"?"#1D9E75":S.syncStatus==="error"?"#e24b4a":"#888")+'">'
    +(S.syncStatus==="ok"?"✓":S.syncStatus==="error"?"✕":"↻")+'</button>'
    +'<button id="editIcon" onclick="toggleReorder()" title="'+(S.reorderMode?"Listo (reordenar días)":"Reordenar días")+'" style="border:none;background:transparent;cursor:pointer;font-size:15px;padding:2px 4px;color:'+(S.reorderMode?"#BA7517":"#888")+'">'+(S.reorderMode?'✓':'✏️')+'</button>'
    +(S.driveFile?'<button id="driveIcon" onclick="reconnectDrive()" title="Drive: '+(S.driveFile.name||"").replace(/"/g,"&quot;")+' — toca para reconectar/sincronizar" style="border:none;background:transparent;cursor:pointer;font-size:12px;padding:2px 4px;color:'+(S.driveStatus==="ok"?"#1D9E75":S.driveStatus==="syncing"?"#888":S.driveStatus==="error"?"#e24b4a":"#888")+'">'+(S.driveStatus==="ok"?"💾✓":S.driveStatus==="syncing"?"💾↻":S.driveStatus==="error"?"💾✕":"💾")+'</button>':'')
    +(S.mesoList.length>1
      ?'<select onchange="setMeso(this.value)" style="padding:4px 8px;border-radius:8px;border:.5px solid #ccc;background:#f5f5f3;font-size:12px">'
       +S.mesoList.map((m,i)=>'<option value="'+m+'"'+(m===S.meso?' selected':'')+'>'
         +'Meso '+m+(i===S.mesoList.length-1?' ★':'')+'</option>').join('')+'</select>'
      :'<span style="font-size:11px;color:#888">Meso '+S.meso+'</span>')
    +'<div class="vtog">'
    +'<button class="vbtn'+(v==="workout"?" on":"")+'" onclick="setView(\'workout\')">Entreno</button>'
    +'<button class="vbtn'+(v==="progress"?" on":"")+'" onclick="setView(\'progress\')">Progreso</button>'
    +'<button class="vbtn'+(v==="sync"?" on":"")+'" onclick="setView(\'sync\')">Sync</button>'
    +'</div></div></div>';

  // Day nav
  const dname=n=>getDayName(n).replace(/'/g,"&#39;");
  const dOrder=getDayOrder();
  html+='<div class="daynav">'+WDS.map((wd,pos)=>{
    const d=dOrder[pos];
    if(d==null)return'<button class="dbtn" style="opacity:.35;pointer-events:none">'+wd+'</button>';
    const act=!S.reorderMode&&d===S.day;
    const picked=S.reorderMode&&S.swapPick===pos;
    const bs=picked?'border-color:#BA7517;background:#BA751722;color:#BA7517'
      :act?'border-color:'+pc+';background:'+pc:'';
    return'<button class="dbtn'+(act?' on':'')+'" style="'+bs+'" onclick="tapDayTab('+pos+')">'
      +wd+'<span style="opacity:.7;font-size:10px;display:block;line-height:1.2">'+(S.reorderMode?dname(d):dname(d))+'</span></button>';
  }).join('')
    +'</div>'
    +(S.reorderMode?'<p style="font-size:11px;color:#888;margin:4px 0 0;text-align:center">Toca dos días para intercambiarlos. Pulsa ✓ (arriba) cuando termines.</p>':'');

  // Week nav
  if(v!=="progress"){
    html+='<div class="wknav">'+WEEKS.map(w=>{
      const wpc=PC[w.phase]||"#378ADD";const done=isDoneVal(S.store[doneKey(S.day,w.id)]);const act=w.id===S.week;
      return'<button class="wkbtn" style="border-color:'+(act?wpc:'#e0dfd8')
        +';background:'+(act?wpc:done?wpc+'25':'transparent')
        +';color:'+(act?'#fff':done?wpc:'#888')
        +';font-weight:'+(act?500:400)+'" onclick="setWeek('+w.id+')" title="'+w.phase+'">'+w.label+'</button>';
    }).join('')+'<button class="pbadge" onclick="openWeekPicker()" title="Cambiar semana/mesociclo" style="background:'+pc+'22;color:'+pc+';border:none;cursor:pointer">'+wk.phase+' ▾</button></div>';
  }

  if(v==="workout"){
    html+='<div class="dname-bar">'
      +'<span style="font-size:11px;color:#888;white-space:nowrap">'+WDS[weekdayPosFor(S.day)]+' —</span>'
      +'<input type="text" value="'+getDayName(S.day).replace(/"/g,'&quot;')+'" '
      +'onchange="setDayName('+S.day+',this.value)" placeholder="Nombre del entrenamiento..."></div>';
    html+='<div class="thead">'
      +'<span class="th" style="width:38%">Ejercicio</span>'
      +'<span class="th" style="width:16%">Detalles</span>'
      +'<span class="th" style="width:12%">Desc.</span>'
      +'<span class="th" style="width:20%">Prescripción</span>'
      +'<span class="th" style="width:14%">kg</span></div>';

    html+=exs.map((ex,i)=>{
      const pres=ex.weeks[S.week-1]||"-";
      const skip=pres==="-";
      const ssParts=supersetParts(ex.name); // súper serie por "+" en el nombre
      // Etiquetas de los inputs de peso: si es súper serie, los dos nombres;
      // si es ejercicio doble (prescripción con "/"), las dos prescripciones.
      let labels;
      if(ssParts)labels=ssParts;
      else if(!skip&&pres.includes(" / "))labels=pres.split(" / ");
      else labels=[pres];
      const isMulti=labels.length>1;
      const kgVals=isMulti
        ?labels.map((_,si)=>S.store[kgKey(S.day,S.week,i,si)]||"")
        :[S.store[kgKey(S.day,S.week,i)]||""];
      const kgDisplay=kgVals.filter(Boolean).join(" / ");
      const note=S.store[noteKey(S.day,S.week,i)]||"";
      const isExp=S.exp===i;

      let expHtml="";
      if(isExp&&!skip){
        expHtml='<div class="exexp">';
        if(isMulti){
          labels.forEach((p,si)=>{
            const val=S.store[kgKey(S.day,S.week,i,si)]||"";
            expHtml+='<div><label>'+esc(p)+' — kg</label>'
              +'<input type="number" value="'+val+'" placeholder="0" style="width:80px" '
              +'oninput="updKg('+S.day+','+S.week+','+i+',this.value,'+si+')"></div>';
          });
        }else{
          const val=S.store[kgKey(S.day,S.week,i)]||"";
          expHtml+='<div><label>Carga (kg)</label>'
            +'<input type="number" value="'+val+'" placeholder="0" style="width:80px" '
            +'oninput="updKg('+S.day+','+S.week+','+i+',this.value)"></div>';
        }
        expHtml+='<div style="flex:1;min-width:140px"><label>Observaciones</label>'
          +'<input type="text" value="'+note.replace(/"/g,'&quot;')+'" placeholder="Notas..." '
          +'style="width:100%" oninput="updNote('+S.day+','+S.week+','+i+',this.value)"></div>'
          +'</div>';
      }

      return'<div class="exrow">'
        +'<div class="exmain'+(skip?' skip':'')+(isExp?' exp':'')+'" onclick="'+(skip?'':'toggleEx('+i+')')+'"><span style="width:38%;font-size:13px">'+esc(ex.name)+'</span>'
        +'<span style="width:16%;font-size:11px;color:#888">'+esc(ex.details||'—')+'</span>'
        +'<span style="width:12%;font-size:11px;color:#888">'+esc(ex.rest||'—')+'</span>'
        +'<span style="width:20%;font-size:13px;font-weight:500;color:'+(skip?'#888':pc)+'">'+(skip?'—':esc(pres))+'</span>'
        +'<span style="width:14%;font-size:12px">'+(kgDisplay?'<span style="color:'+pc+';font-weight:500">'+esc(kgDisplay)+' kg</span>':'<span style="color:#ccc">—</span>')+'</span></div>'
        +expHtml+'</div>';
    }).join('');

    html+='<div style="padding:1rem 16px 0"><button class="donebtn" style="background:'+(isDone?'#1D9E75':pc)+'" onclick="toggleDone('+S.day+','+S.week+')">'+(isDone?'✓ Completada':'Marcar sesión completada')+'</button></div>';
  }

  if(v==="progress")html+=renderProgress(exs);
  if(v==="sync")html+=renderSync();

  document.getElementById("app").innerHTML=html;
  if(v==="progress")setTimeout(initCharts,50);
}

// ── Progress view ─────────────────────────────────────────────────────────────
function renderProgress(exs){
  if(S.progEx>=exs.length)S.progEx=0;
  const datasets=buildDatasets();
  const allVals=datasets.flatMap(d=>d.data).filter(v=>v!==null);
  const hasData=allVals.length>0;
  const gMax=hasData?Math.max(...allVals):0;
  const lastVals=(datasets.length?datasets[datasets.length-1].data:[]).filter(v=>v!==null);
  const firstVals=(datasets.length?datasets[0].data:[]).filter(v=>v!==null);
  const lastMax=lastVals.length?Math.max(...lastVals):0;
  const firstMax=firstVals.length?Math.max(...firstVals):0;
  const pct=firstMax?Math.round(((lastMax-firstMax)/firstMax)*100):0;
  const lastKg=lastVals.length?lastVals[lastVals.length-1]:0;
  const globalPoints=[],globalColors=[],globalLabels=[];
  datasets.forEach((ds,mi)=>{ds.data.forEach((v,wi)=>{if(v!==null){globalPoints.push(v);globalColors.push(MC[mi%6]);globalLabels.push(ds.label+' S'+(wi+1));}});});
  const totalSessions=globalPoints.length;
  const ptab=S.progTab;

  let h='<div style="padding:1rem">';
  h+='<select style="width:100%;padding:6px 10px;border-radius:8px;border:.5px solid #ccc;background:#f5f5f3;font-size:13px;margin-bottom:.75rem" onchange="setProgEx(this.value)">'
    +exs.map((ex,i)=>'<option value="'+i+'"'+(i===S.progEx?' selected':'')+'>'+esc(ex.name)+'</option>').join('')+'</select>';
  h+='<div class="ptabs">'
    +'<button class="ptab" onclick="setProgTab(\'meso\')" style="border-bottom:'+(ptab==='meso'?'2px solid #378ADD':'2px solid transparent')+';color:'+(ptab==='meso'?'#378ADD':'#888')+';font-weight:'+(ptab==='meso'?500:400)+'">Por mesociclo</button>'
    +'<button class="ptab" onclick="setProgTab(\'global\')" style="border-bottom:'+(ptab==='global'?'2px solid #378ADD':'2px solid transparent')+';color:'+(ptab==='global'?'#378ADD':'#888')+';font-weight:'+(ptab==='global'?500:400)+'">Global histórico</button>'
    +'</div>';

  if(!hasData){h+='<p style="text-align:center;color:#888;font-size:13px;padding:2rem 0">Sin cargas registradas aún.</p></div>';return h;}

  h+='<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:1rem">'
    +'<div style="background:#f5f5f3;border-radius:8px;padding:12px"><div style="font-size:11px;color:#888;margin-bottom:4px">Máximo histórico</div><div style="font-size:20px;font-weight:500">'+gMax+' kg</div></div>'
    +'<div style="background:#f5f5f3;border-radius:8px;padding:12px"><div style="font-size:11px;color:#888;margin-bottom:4px">Progreso total</div><div style="font-size:20px;font-weight:500;color:'+(pct>=0?'#1D9E75':'#e24b4a')+'">'+(pct>=0?'+':'')+pct+'%</div></div>'
    +'<div style="background:#f5f5f3;border-radius:8px;padding:12px"><div style="font-size:11px;color:#888;margin-bottom:4px">'+(ptab==='meso'?'Última carga':'Sesiones totales')+'</div><div style="font-size:20px;font-weight:500">'+(ptab==='meso'?lastKg+' kg':totalSessions)+'</div></div>'
    +'</div>';

  if(ptab==='meso'){
    h+='<div class="card"><div class="cardh"><span style="font-size:12px;font-weight:500;color:#888">Progreso por mesociclo</span>'
      +'<div style="display:flex;gap:10px;flex-wrap:wrap">'+datasets.map(ds=>'<span style="display:flex;align-items:center;gap:4px;font-size:11px;color:#888"><span style="width:10px;height:2px;background:'+ds.color+';display:inline-block;border-radius:1px"></span><span style="width:8px;height:8px;border-radius:50%;background:'+ds.color+';display:inline-block"></span>'+ds.label+'</span>').join('')+'</div>'
      +'</div><div style="padding:12px 16px;position:relative;height:220px"><canvas id="progChart"></canvas></div></div>';
    h+='<div class="card"><div class="cardh"><span style="font-size:13px;font-weight:500">Máximo por mesociclo</span></div>'
      +datasets.map((ds,mi)=>{
        const vals=ds.data.filter(v=>v!==null);if(!vals.length)return'';
        const mx=Math.max(...vals);
        const prevVals=mi>0?datasets[mi-1].data.filter(v=>v!==null):[];
        const prev=prevVals.length?Math.max(...prevVals):null;
        const diff=prev!==null?(mx-prev).toFixed(1):null;
        return'<div class="histrow"><div style="display:flex;align-items:center;gap:8px">'
          +'<span style="width:8px;height:8px;border-radius:50%;background:'+ds.color+';display:inline-block"></span>'
          +ds.label+'<span style="font-size:11px;color:#888">('+ds.weeks+' sem.)</span></div>'
          +'<div style="display:flex;align-items:center;gap:10px">'
          +(diff!==null?'<span style="font-size:11px;color:'+(parseFloat(diff)>=0?'#1D9E75':'#e24b4a')+'">'+(parseFloat(diff)>=0?'+':'')+diff+' kg</span>':'')
          +'<span style="font-weight:500">'+mx+' kg</span></div></div>';
      }).join('')+'</div>';
  }else{
    h+='<div class="card"><div class="cardh"><span style="font-size:12px;font-weight:500;color:#888">Evolución continua (todas las sesiones)</span></div>'
      +'<div style="padding:12px 16px;position:relative;height:220px"><canvas id="progChart"></canvas></div></div>';
    h+='<div class="card"><div class="cardh"><span style="font-size:12px;font-weight:500;color:#888">Máximo por mesociclo</span></div>'
      +'<div style="padding:12px 16px;position:relative;height:160px"><canvas id="summaryChart"></canvas></div></div>';
  }
  h+='</div>';
  return h;
}

function initCharts(){
  if(S.view!=='progress')return;
  const datasets=buildDatasets();
  const allVals=datasets.flatMap(d=>d.data).filter(v=>v!==null);
  if(!allVals.length)return;
  if(S.chart){S.chart.destroy();S.chart=null;}
  if(S.chart2){S.chart2.destroy();S.chart2=null;}
  const globalPoints=[],globalColors=[],globalLabels=[];
  datasets.forEach((ds,mi)=>{ds.data.forEach((v,wi)=>{if(v!==null){globalPoints.push(v);globalColors.push(MC[mi%6]);globalLabels.push(ds.label+' S'+(wi+1));}});});
  const mesoMaxes=datasets.map(d=>{const v=d.data.filter(x=>x!==null);return v.length?Math.max(...v):0;});

  if(S.progTab==='meso'){
    const canvas=document.getElementById('progChart');if(!canvas)return;
    const maxW=Math.max(...datasets.map(ds=>ds.weeks));
    const labels=Array.from({length:maxW},(_,i)=>'S'+(i+1));
    const cds=datasets.map(ds=>{
      const padded=[...ds.data,...Array(maxW-ds.weeks).fill(null)];
      return{label:ds.label,data:padded,borderColor:ds.color,backgroundColor:ds.color,
        pointBackgroundColor:padded.map(v=>v!==null?ds.color:'transparent'),
        pointBorderColor:padded.map(v=>v!==null?ds.color:'transparent'),
        pointRadius:padded.map(v=>v!==null?6:0),pointHoverRadius:9,
        borderWidth:2,spanGaps:false,tension:.3};
    });
    S.chart=new Chart(canvas,{type:'line',data:{labels,datasets:cds},
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false},tooltip:{filter:i=>i.raw!==null,callbacks:{label:ctx=>ctx.dataset.label+': '+ctx.raw+' kg'}}},
        scales:{x:{grid:{display:false},ticks:{color:'#888',font:{size:11},autoSkip:false}},
          y:{grid:{color:'rgba(0,0,0,.05)'},ticks:{color:'#888',font:{size:11},callback:v=>v+' kg'},beginAtZero:false}}}});
  }else{
    const c1=document.getElementById('progChart');
    if(c1)S.chart=new Chart(c1,{type:'line',data:{labels:globalLabels,datasets:[{
      label:'Carga',data:globalPoints,borderColor:'rgba(180,178,169,.3)',backgroundColor:'rgba(180,178,169,.3)',
      borderWidth:1.5,tension:.3,showLine:true,
      pointBackgroundColor:globalColors,pointBorderColor:globalColors,pointRadius:5,pointHoverRadius:7}]},
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>ctx.label+': '+ctx.raw+' kg'}}},
        scales:{x:{display:false},y:{grid:{color:'rgba(0,0,0,.05)'},ticks:{color:'#888',font:{size:11},callback:v=>v+' kg'},beginAtZero:false}}}});
    setTimeout(()=>{
      const c2=document.getElementById('summaryChart');
      if(c2)S.chart2=new Chart(c2,{type:'bar',data:{
        labels:datasets.map(ds=>ds.label),
        datasets:[{label:'Máximo',data:mesoMaxes,backgroundColor:datasets.map(ds=>ds.color),borderRadius:3}]},
        options:{responsive:true,maintainAspectRatio:false,
          plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>ctx.raw+' kg'}}},
          scales:{x:{grid:{display:false},ticks:{color:'#888',font:{size:11}}},
            y:{grid:{color:'rgba(0,0,0,.05)'},ticks:{color:'#888',font:{size:11},callback:v=>v+' kg'},beginAtZero:false}}}});
    },50);
  }
}

  const wasOpen=S.exp!==null;

function toggleDone(d,w){const k=doneKey(d,w);if(isDoneVal(S.store[k]))delete S.store[k];else S.store[k]="1";saveStore();render();}
function setDayName(d,v){S.store[dnameKey(d)]=v;saveStore();}
function setProgEx(v){S.progEx=+v;if(S.chart){S.chart.destroy();S.chart=null;}if(S.chart2){S.chart2.destroy();S.chart2=null;}render();}
function setProgTab(t){S.progTab=t;if(S.chart){S.chart.destroy();S.chart=null;}if(S.chart2){S.chart2.destroy();S.chart2=null;}render();}

const DRIVE_SCOPE="https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/drive.readonly https://www.googleapis.com/auth/spreadsheets";
let _tokenClient=null,_accessToken=null,_tokenExp=0,_pickerLoaded=false;
function _setTok(resp){_accessToken=resp.access_token;_tokenExp=Date.now()+((+resp.expires_in||3600)-60)*1000;}
function _tokenValid(){return !!_accessToken&&Date.now()<_tokenExp;}

function _driveConfigured(){return !GOOGLE_CLIENT_ID.startsWith("REEMPLAZAR");}

function _initTokenClient(){
  if(_tokenClient)return _tokenClient;
  if(!(window.google&&google.accounts&&google.accounts.oauth2))return null;
  _tokenClient=google.accounts.oauth2.initTokenClient({
    client_id:GOOGLE_CLIENT_ID,scope:DRIVE_SCOPE,callback:()=>{}
  });
  return _tokenClient;
}

function _loadPicker(){
  return new Promise((resolve,reject)=>{
    if(_pickerLoaded)return resolve();
    if(!window.gapi)return reject(new Error("gapi no disponible"));
    gapi.load("picker",{callback:()=>{_pickerLoaded=true;resolve();},onerror:()=>reject(new Error("No se pudo cargar Picker"))});
  });
}

async function openGoogleDrive(){
  if(!_driveConfigured()){
    S.importMsg="err:Falta configurar GOOGLE_CLIENT_ID en el código (ver instrucciones en el SETUP).";
    render();return;
  }
  const tc=_initTokenClient();
  if(!tc){
    S.importMsg="err:Google Identity Services aún no cargó. Espera un segundo y reintenta.";
    render();return;
  }
  tc.callback=async resp=>{
    if(resp.error){S.importMsg="err:Autenticación: "+(resp.error_description||resp.error);render();return;}
    _setTok(resp);
    try{await _loadPicker();_showDrivePicker();}
    catch(e){S.importMsg="err:"+e.message;render();}
  };
  tc.requestAccessToken({prompt:_accessToken?"":"consent"});
}

function _showDrivePicker(){
  const mimes=[
    "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
    "application/vnd.ms-excel",
    "application/vnd.google-apps.spreadsheet"
  ].join(",");
  const view=new google.picker.DocsView(google.picker.ViewId.DOCS)
    .setMimeTypes(mimes).setIncludeFolders(true).setSelectFolderEnabled(false);
  const appId=GOOGLE_CLIENT_ID.split("-")[0]; // nro de proyecto: requerido con scope drive.file
  new google.picker.PickerBuilder()
    .addView(view)
    .setAppId(appId)
    .setOAuthToken(_accessToken)
    .setDeveloperKey(GOOGLE_API_KEY)
    .setCallback(_pickerCallback)
    .setTitle("Selecciona tu planilla")
    .build()
    .setVisible(true);
}

function reconnectDrive(){
  const tc=_initTokenClient();if(!tc)return;
  tc.callback=resp=>{
    if(resp.error){S.driveStatus="error";updateDriveIcon();return;}
    _setTok(resp);S.driveStatus="ok";updateDriveIcon();
    _flushSheet();checkDriveChanges();
  };
  tc.requestAccessToken({prompt:""});
}
function updateDriveIcon(){
  const el=document.getElementById("driveIcon");
  if(!el)return;
  const s=S.driveStatus;
  el.textContent=s==="ok"?"💾✓":s==="syncing"?"💾↻":s==="error"?"💾✕":"💾";
  el.style.color=s==="ok"?"#1D9E75":s==="syncing"?"#888":s==="error"?"#e24b4a":"#888";
}

function _refreshTokenSilent(){
  return new Promise(resolve=>{
    const tc=_initTokenClient();
    if(!tc)return resolve(false);
    tc.callback=resp=>{
      if(resp.error){_accessToken=null;return resolve(false);}
      _setTok(resp);resolve(true);
    };
    try{tc.requestAccessToken({prompt:""});}catch{resolve(false);}
  });
}

let _pendingDrive=null,_driveUploading=false;
function _scheduleDriveUpload(){
  if(!S.driveFile||!S.driveFile.id)return;
  if(S.driveFile.mimeType==="application/vnd.google-apps.spreadsheet")return;
  if(_pendingDrive)clearTimeout(_pendingDrive);
  _pendingDrive=setTimeout(()=>{_pendingDrive=null;_uploadToDrive();},5000);
}

async function _uploadToDrive(){
  if(!S.driveFile||!S.driveFile.id||_driveUploading)return;
  if(!_accessToken){
    const ok=await _refreshTokenSilent();
    if(!ok){S.driveStatus="error";updateDriveIcon();return;}
  }
  _driveUploading=true;S.driveStatus="syncing";updateDriveIcon();
  try{
    const wb=buildWorkbook();
    const buf=XLSX.write(wb,{type:"array",bookType:"xlsx"});
    const url="https://www.googleapis.com/upload/drive/v3/files/"+S.driveFile.id+"?uploadType=media";
    const mime="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
    const doFetch=()=>fetch(url,{method:"PATCH",headers:{"Authorization":"Bearer "+_accessToken,"Content-Type":mime},body:buf});
    let r=await doFetch();
    if(r.status===401){
      const ok=await _refreshTokenSilent();
      if(!ok)throw new Error("Token expirado — vuelve a conectar Drive");
      r=await doFetch();
    }
    if(!r.ok)throw new Error("HTTP "+r.status);
    S.driveStatus="ok";
  }catch(e){
    console.warn("Drive auto-save:",e);
    S.driveStatus="error";
  }finally{
    _driveUploading=false;updateDriveIcon();
  }
}

async function _pickerCallback(data){
  if(!data||data.action!==google.picker.Action.PICKED)return;
  const doc=data.docs&&data.docs[0];
  if(!doc)return;
  S.importMsg="ok:Descargando "+doc.name+"…";render();
  try{
    let url,fname=doc.name||"importado.xlsx";
    if(doc.mimeType==="application/vnd.google-apps.spreadsheet"){
      url="https://www.googleapis.com/drive/v3/files/"+doc.id
        +"/export?mimeType="+encodeURIComponent("application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
      if(!/\.xlsx?$/i.test(fname))fname+=".xlsx";
    }else{
      url="https://www.googleapis.com/drive/v3/files/"+doc.id+"?alt=media";
    }
    const r=await fetch(url,{headers:{Authorization:"Bearer "+_accessToken}});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const blob=await r.blob();
    const file=new File([blob],fname,{type:blob.type||"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
    S.driveFile={id:doc.id,name:doc.name,mimeType:doc.mimeType};
    S.store["_driveFile"]=JSON.stringify(S.driveFile);
    await handleImport(file);
    _refreshMTime();
  }catch(e){S.importMsg="err:Descarga: "+e.message;render();}
}

// ── Boot ──────────────────────────────────────────────────────────────────────
// ── Sync bidireccional con Google Sheet nativo ────────────────────────────────
function colLetter(c){let s="";c++;while(c>0){s=String.fromCharCode(65+(c-1)%26)+s;c=Math.floor((c-1)/26);}return s;}
const _isNativeSheet=()=>!!S.driveFile&&S.driveFile.mimeType==="application/vnd.google-apps.spreadsheet";
let _dirtyCells=new Set(),_pendingSheet=null,_sheetFlushing=false;

function _markSheetDirty(mid,d,w,i,si){
  if(!_isNativeSheet())return false;
  const map=S.sheetMap[mid];if(!map)return false;
  const key=d+"-"+w+"-"+i+(si!==undefined?"-s"+si:"");
  if(!(key in map))return false;
  _dirtyCells.add(mid+"|"+key);
  if(_pendingSheet)clearTimeout(_pendingSheet);
  _pendingSheet=setTimeout(()=>{_pendingSheet=null;_flushSheet();},4000);
  return true;
}

// Notas: mismo mecanismo, marcadas con prefijo "N#" para distinguir de cargas.
function _markNoteDirty(mid,d,w,i){
  if(!_isNativeSheet())return false;
  const map=S.noteMap[mid];if(!map)return false;
  const key=d+"-"+w+"-"+i;
  if(!(key in map))return false;
  _dirtyCells.add("N#"+mid+"|"+key);
  if(_pendingSheet)clearTimeout(_pendingSheet);
  _pendingSheet=setTimeout(()=>{_pendingSheet=null;_flushSheet();},4000);
  return true;
}

function _sheetPayload(items){
  const data=[];
  const ssDone=new Set(); // celdas de súper serie ya emitidas (evita duplicar)
  for(const it of items){
    const isNote=it.startsWith("N#");
    const item=isNote?it.slice(2):it;
    const bar=item.indexOf("|");
    const mid=item.slice(0,bar),key=item.slice(bar+1);
    const sn=String((S.mesoMeta[mid]&&S.mesoMeta[mid].sheetName)||("Hoja"+mid)).replace(/'/g,"''");
    if(isNote){
      const cell=S.noteMap[mid]&&S.noteMap[mid][key];if(!cell)continue;
      const parts=cell.split(",");const r=+parts[0],c=+parts[1];
      const m=/^(\d+)-(\d+)-(\d+)$/.exec(key);if(!m)continue;
      const val=S.store["note-"+m[1]+"-"+m[2]+"-"+m[3]+"-m"+mid];
      data.push({range:"'"+sn+"'!"+colLetter(c)+(r+1),values:[[val==null?"":String(val)]]});
      continue;
    }
    const cell=S.sheetMap[mid]&&S.sheetMap[mid][key];if(!cell)continue;
    const parts=cell.split(",");const r=+parts[0],c=+parts[1];
    const m=/^(\d+)-(\d+)-(\d+)(?:-s(\d+))?$/.exec(key);if(!m)continue;
    const baseKey=m[1]+"-"+m[2]+"-"+m[3];
    let base=mid==="1"?"kg-"+baseKey:"kg-"+baseKey+"-m"+mid;
    // Súper serie: combinar los dos sub-pesos "s0 / s1" en la única celda.
    if(S.ssMap[mid]&&S.ssMap[mid][baseKey]){
      const ssId=mid+"|"+baseKey;
      if(ssDone.has(ssId))continue; // ya emitida por el otro sub-peso
      ssDone.add(ssId);
      const a=S.store[base+"-s0"],b=S.store[base+"-s1"];
      const combined=[a,b].filter(x=>x!=null&&String(x).trim()!=="").join(" / ");
      data.push({range:"'"+sn+"'!"+colLetter(c)+(r+1),values:[[combined]]});
      continue;
    }
    if(m[4]!==undefined)base+="-s"+m[4];
    const val=S.store[base];
    data.push({range:"'"+sn+"'!"+colLetter(c)+(r+1),values:[[val==null?"":String(val)]]});
  }
  return data;
}

async function _flushSheet(){
  if(_sheetFlushing||!_dirtyCells.size||!_isNativeSheet())return;
  if(!_tokenValid()){
    const ok=await _refreshTokenSilent();
    if(!ok){S.driveStatus="error";updateDriveIcon();return;}
  }
  _sheetFlushing=true;S.driveStatus="syncing";updateDriveIcon();
  const batch=[..._dirtyCells];_dirtyCells.clear();
  try{
    const data=_sheetPayload(batch);
    if(data.length){
      const r=await fetch("https://sheets.googleapis.com/v4/spreadsheets/"+S.driveFile.id+"/values:batchUpdate",{
        method:"POST",
        headers:{"Authorization":"Bearer "+_accessToken,"Content-Type":"application/json"},
        body:JSON.stringify({valueInputOption:"RAW",data})
      });
      if(!r.ok)throw new Error("Sheets HTTP "+r.status);
      await _refreshMTime();
    }
    S.driveStatus="ok";
  }catch(e){
    console.warn("Sheet write:",e);
    batch.forEach(k=>_dirtyCells.add(k));
    S.driveStatus="error";
  }finally{
    _sheetFlushing=false;updateDriveIcon();
  }
}

async function _refreshMTime(){
  if(!S.driveFile||!_accessToken)return;
  try{
    const r=await fetch("https://www.googleapis.com/drive/v3/files/"+S.driveFile.id+"?fields=modifiedTime",
      {headers:{Authorization:"Bearer "+_accessToken}});
    if(!r.ok)return;
    const mt=(await r.json()).modifiedTime||"";
    if(mt){S.store["_driveMTime"]=mt;saveLocal();}
  }catch{}
}

async function _downloadSheetFile(){
  let fname=S.driveFile.name||"planilla.xlsx";
  const url="https://www.googleapis.com/drive/v3/files/"+S.driveFile.id
    +"/export?mimeType="+encodeURIComponent("application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
  if(!/\.xlsx?$/i.test(fname))fname+=".xlsx";
  const r=await fetch(url,{headers:{Authorization:"Bearer "+_accessToken}});
  if(!r.ok)throw new Error("HTTP "+r.status);
  const blob=await r.blob();
  return new File([blob],fname,{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}

async function checkDriveChanges(){
  if(!_isNativeSheet())return;
  if(_sheetFlushing||_pendingSheet||_dirtyCells.size)return; // vaciar escrituras primero
  if(S.exp!==null)return;                                     // usuario editando: no interrumpir
  if(!_tokenValid()){
    // Token expirado (~1h): intentar renovar en silencio una vez antes de rendirse.
    const ok=await _refreshTokenSilent();
    if(!ok){S.driveStatus="error";updateDriveIcon();return;}
    S.driveStatus="ok";updateDriveIcon();
  }
  try{
    const r=await fetch("https://www.googleapis.com/drive/v3/files/"+S.driveFile.id+"?fields=modifiedTime",
      {headers:{Authorization:"Bearer "+_accessToken}});
    if(r.status===401){_accessToken=null;S.driveStatus="error";updateDriveIcon();return;}
    if(!r.ok)return;
    const mt=(await r.json()).modifiedTime||"";
    const known=S.store["_driveMTime"]||"";
    if(!known){if(mt){S.store["_driveMTime"]=mt;saveLocal();}return;}
    if(!mt||mt<=known)return;
    S.driveStatus="syncing";updateDriveIcon();
    const file=await _downloadSheetFile();
    await handleImport(file,{silent:true});
    S.store["_driveMTime"]=mt;saveLocal();
    S.driveStatus="ok";updateDriveIcon();
  }catch(e){console.warn("Drive poll:",e);S.driveStatus="error";updateDriveIcon();}
}

loadLocal();
normStore();
if(S.store["_mesoList"])try{S.mesoList=JSON.parse(S.store["_mesoList"]);S.meso=S.mesoList[S.mesoList.length-1];}catch{}
if(S.store["_mesoMeta"])try{S.mesoMeta=JSON.parse(S.store["_mesoMeta"]);const m=S.mesoMeta[S.meso];if(m?.planData)S.plan=m.planData;}catch{}
if(S.store["_mesoWeeks"])try{S.mesoWeeks=JSON.parse(S.store["_mesoWeeks"]);}catch{}
if(S.store["_driveFile"])try{S.driveFile=JSON.parse(S.store["_driveFile"]);}catch{}
if(S.store["_sheetMap"])try{S.sheetMap=JSON.parse(S.store["_sheetMap"]);}catch{}
if(S.store["_noteMap"])try{S.noteMap=JSON.parse(S.store["_noteMap"]);}catch{}
if(S.store["_ssMap"])try{S.ssMap=JSON.parse(S.store["_ssMap"]);}catch{}
if(S.store["_lastPos"])try{
  const p=JSON.parse(S.store["_lastPos"]);
  if(S.mesoList.includes(p.meso)){S.meso=p.meso;const m=S.mesoMeta[S.meso];if(m?.planData)S.plan=m.planData;}
  if(+p.week)S.week=+p.week;
}catch{}
S.askStart=false; // v10.6: la pantalla de selección ya no aparece sola (accesible a mano)
render();
setTimeout(syncCloud,800);
setInterval(()=>{if(!S.syncing)syncCloud();},60000);
setTimeout(checkDriveChanges,3000);
setInterval(checkDriveChanges,60000);
</script>
