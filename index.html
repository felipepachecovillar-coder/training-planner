  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  select, input { font-family: inherit; }
  input[type=number]::-webkit-inner-spin-button { opacity: 1; }

  .header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 12px; border-bottom: 0.5px solid #e0dfd8; }

  .view-btn.active { background: #e0dfd8; color: #1a1a1a; font-weight: 500; }

  .day-nav { display: flex; gap: 4px; padding: 8px 16px; border-bottom: 0.5px solid #e0dfd8; overflow-x: auto; }
  .day-btn { padding: 4px 12px; border-radius: 8px; border: 0.5px solid #e0dfd8; background: transparent; color: #888; font-size: 12px; white-space: nowrap; transition: all 0.15s; }
  .day-btn.active { color: #fff; font-weight: 500; }

  .week-nav { display: flex; align-items: center; gap: 3px; padding: 8px 16px; border-bottom: 0.5px solid #e0dfd8; overflow-x: auto; }
  .week-btn { min-width: 32px; height: 28px; border-radius: 8px; border: 0.5px solid #e0dfd8; background: transparent; color: #888; font-size: 11px; transition: all 0.15s; }
  .phase-badge { font-size: 11px; padding: 2px 8px; border-radius: 8px; font-weight: 500; white-space: nowrap; margin-left: 6px; }

  .table-header { display: flex; padding: 5px 16px; background: #f5f5f3; border-bottom: 0.5px solid #e0dfd8; }
  .th { font-size: 11px; color: #888; font-weight: 500; }

  .ex-row { border-bottom: 0.5px solid #e0dfd8; }
  .ex-main { display: flex; align-items: center; padding: 7px 16px; cursor: pointer; transition: background 0.1s; }
  .ex-main:hover { background: #f9f9f7; }
  .ex-main.expanded { background: #f5f5f3; }
  .ex-main.skip { opacity: 0.4; cursor: default; }
  .ex-expand { padding: 8px 16px 10px; background: #f5f5f3; display: flex; gap: 10px; }
  .ex-expand input { padding: 5px 8px; font-size: 13px; border-radius: 8px; border: 0.5px solid #ccc; background: #fff; color: #1a1a1a; }
  .ex-expand label { font-size: 11px; color: #888; display: block; margin-bottom: 3px; }

  .sync-card h3 { font-size: 14px; font-weight: 500; margin-bottom: 4px; }
  .sync-card p { font-size: 12px; color: #888; margin-bottom: 12px; line-height: 1.5; }
  .btn-upload { padding: 8px 18px; border-radius: 8px; border: 0.5px solid #ccc; background: transparent; color: #1a1a1a; font-size: 13px; }
  .btn-export { padding: 8px 18px; border-radius: 8px; border: none; color: #fff; font-size: 13px; font-weight: 500; }
  .msg { padding: 10px 14px; border-radius: 8px; font-size: 12px; margin-top: 8px; }

  .msg.err { background: #fcebeb; color: #a32d2d; }
  .flow-note { padding: 12px 14px; background: #f5f5f3; border-radius: 8px; font-size: 12px; color: #888; line-height: 1.6; }

async function cloudGet() {
  try {
    const r = await fetch(FIRESTORE_URL + `?key=${FIREBASE_CONFIG.apiKey}`);
    if (r.status === 404) return {}; // Document not created yet — return empty
    if (!r.ok) return null;
    const j = await r.json();
    if (!j.fields) return {};
    const result = {};
    Object.entries(j.fields).forEach(([k, v]) => {
      result[k] = v.stringValue ?? String(v.integerValue ?? v.doubleValue ?? "");
    });
    return result;
  } catch(e) { console.log("cloudGet error:", e); return null; }
}

async function cloudSetMany(pairs) {
  try {
    const current = await cloudGet() || {};
    pairs.forEach(([k,v]) => current[k] = v);
    const fields = {};
    Object.entries(current).forEach(([k,v]) => {
      fields[k] = { stringValue: String(v) };
    });
    // Try PATCH first, if 404 use POST to create
    const patchUrl = FIRESTORE_URL + `?key=${FIREBASE_CONFIG.apiKey}`;
    const r = await fetch(patchUrl, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ fields })
    });
    if (r.status === 404) {
      // Document doesn't exist — create it
      const postUrl = `https://firestore.googleapis.com/v1/projects/${FIREBASE_CONFIG.projectId}/databases/(default)/documents/training?documentId=data&key=${FIREBASE_CONFIG.apiKey}`;
      await fetch(postUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ fields })
      });
    }
  } catch(e) { console.log("cloudSetMany error:", e); }
}

async function cloudSet(key, value) {
  await cloudSetMany([[key, value]]);

};

function saveStore() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state.store));
  if (syncEnabled) {
    const pairs = Object.entries(state.store).filter(([k]) =>
      k.startsWith("kg-") || k.startsWith("note-") || k.startsWith("done-") || k.startsWith("dayname-") || k.startsWith("_meso")
    );
    if (pairs.length) cloudSetMany(pairs);
  }
}

async function loadFromCloud() {
  syncStatus = "syncing"; // Auto-load from cloud on start
if (syncEnabled) {
  // Show local data immediately if available
  const localRaw = localStorage.getItem(STORAGE_KEY);
  if (localRaw) {
    try {
      const local = JSON.parse(localRaw);
      state.store = local;
      if (local["_mesoList"]) {
        state.mesoList = JSON.parse(local["_mesoList"]);
        state.currentMeso = state.mesoList[state.mesoList.length - 1];
      }
      if (local["_mesoMeta"]) {
        state.mesoMeta = JSON.parse(local["_mesoMeta"]);
        const meta = state.mesoMeta[state.currentMeso];
        if (meta && meta.planData) state.planData = meta.planData;
      }
    } catch {}
    render(); // Show local data right away
  } else {
    // No local data — show loading screen
    document.getElementById("app").innerHTML = `
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:12px;color:#888;font-family:-apple-system,sans-serif">
        <div style="font-size:28px">↻</div>
        <div style="font-size:14px">Cargando datos...</div>
      </div>`;
  }
  // Then sync with cloud in background
  loadFromCloud();
} else {
  render();
}
  const data = await cloudGet();
  if (data) {
    // Merge cloud into local (cloud wins)
    state.store = { ...state.store, ...data };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.store));
    syncStatus = "ok";
  } else {
    syncStatus = syncEnabled ? "error" : "idle";
  }
  render();
}
function upd(key, val) { state.store[key] = val; saveStore(); render(); }

// ── Day name helpers ───────────────────────────────────────────────────────
function getDayName(dayId) {
  const custom = state.store[`dayname-${state.currentMeso}-${dayId}`];
  if (custom) return custom;
  // Try to get from imported meso planData
  const meta = state.mesoMeta[state.currentMeso];
  if (meta && meta.dayNames && meta.dayNames[dayId]) return meta.dayNames[dayId];
  return DEFAULT_DAYS[dayId-1]?.name || "";
}
function setDayName(dayId, val) {
  state.store[`dayname-${state.currentMeso}-${dayId}`] = val;
  saveStore(); render();
}

// ── Parse xlsx ─────────────────────────────────────────────────────────────
async function handleImport(file) {
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: "array" });

    // Reset meso state
    state.mesoList = [];
    state.mesoMeta = {}; // mesoId -> { sheetName, rows, dayBlocks, planData }

    wb.SheetNames.forEach((sheetName, si) => {
      const mesoId = String(si + 1);
      const ws = wb.Sheets[sheetName];
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" });
      const dayBlocks = parseDayBlocks(rows);
      if (!dayBlocks.length) return;

      state.mesoList.push(mesoId);

      // Build planData for this meso
      const planData = {};
      const dayNames = {};
      dayBlocks.forEach((block, dIdx) => {
        const dayId = dIdx + 1;
        // Extract day type name from block (e.g. "Pierna anterior")
        dayNames[dayId] = block.typeName || block.label || "";
        planData[dayId] = block.exercises.map((ex, exIdx) => {
          const weeks = Array.from({length:10}, (_,wIdx) => {
            const wc = ex.weekCols.find(c => c.weekNum === wIdx+1);
            return wc ? String(rows[ex.rowIdx][wc.presCol]||"").trim()||"-" : "-";
          });

          // Read existing loads from the sheet into store
          ex.weekCols.forEach(wc => {
            const raw = rows[ex.rowIdx][wc.loadCol];
            const val = raw !== "" && raw !== undefined && raw !== null ? String(raw).trim() : "";
            if (val && val !== "0") {
              const k = mesoId === "1"
                ? `kg-${dayId}-${wc.weekNum}-${exIdx}`
                : `kg-${dayId}-${wc.weekNum}-${exIdx}-meso${mesoId}`;
              state.store[k] = val;
            }
          });

          return { name: ex.name, details: ex.details, rest: ex.rest, weeks };
        });
      });

      state.mesoMeta[mesoId] = { sheetName, rows, dayBlocks, planData, dayNames, wb };
    });

    if (!state.mesoList.length) {
      state.importMsg = "err:No se encontraron mesociclos válidos en el archivo.";
      render(); return;
    }

    saveStore();

    // Save structure to cloud (without wb object which can't be serialized)
    const mesoMetaSerializable = {};
    state.mesoList.forEach(mid => {
      const m = state.mesoMeta[mid];
      if (m) mesoMetaSerializable[mid] = { sheetName: m.sheetName, planData: m.planData, dayNames: m.dayNames };
    });
    const structPairs = [
      ["_mesoList", JSON.stringify(state.mesoList)],
      ["_mesoMeta", JSON.stringify(mesoMetaSerializable)],
    ];
    await cloudSetMany(structPairs);
    state.store["_mesoList"] = JSON.stringify(state.mesoList);
    state.store["_mesoMeta"] = JSON.stringify(mesoMetaSerializable);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.store));

    // Set current meso to last sheet
    state.currentMeso = state.mesoList[state.mesoList.length - 1];
    state.planData = state.mesoMeta[state.currentMeso].planData;
    state.xlsxMeta = { wb, fileName: file.name };
    state.activeWeek = 1;
    state.importMsg = `ok:✓ ${file.name} — ${state.mesoList.length} mesociclos cargados. Actual: Mesociclo ${state.currentMeso}`;
  } catch(e) {
    state.importMsg = "err:Error al leer: " + e.message;
  }
  render();
}

function parseDayBlocks(rows) {
  const days = []; let cur = null; let hRow = -1;

  for (let r = 0; r < rows.length; r++) {
    // "Día" puede estar en col 0 o col 1
    let dayCol = -1;
    for (let c = 0; c <= 2; c++) {
      if (String(rows[r][c]||"").trim().startsWith("Día")) { dayCol = c; break; }
    }

    if (dayCol >= 0) {
      if (cur) days.push(cur);
      // typeName: col after dayCol (e.g. "Pierna anterior")
      const typeName = String(rows[r][dayCol+1]||"").trim();
      cur = { label: String(rows[r][dayCol]||"").trim(), typeName, dayCol, exercises: [], headerRow: r+1 };
      hRow = r + 1;
      continue;
    }

    if (!cur || r <= hRow) continue;

    // Nombre del ejercicio: buscar en col dayCol o dayCol+1
    const dc = cur.dayCol;
    const name = String(rows[r][dc]||"").trim() || String(rows[r][dc+1]||"").trim();
    if (!name || name.toLowerCase().startsWith("día")) continue;

    // Detectar columnas s1..s10 en la fila de header
    const hdr = rows[hRow] || [];
    const weekCols = [];
    for (let c = 0; c < hdr.length; c++) {
      const h = String(hdr[c]||"").trim().toLowerCase();
      if (/^s\d+$/.test(h)) {
        const wNum = parseInt(h.replace("s",""));
        // loadCol: buscar "Carga sN" en siguiente columna(s)
        let loadCol = c + 1;
        for (let lc = c+1; lc < Math.min(c+3, hdr.length); lc++) {
          if (String(hdr[lc]||"").toLowerCase().includes("carga")) { loadCol = lc; break; }
        }
        weekCols.push({ presCol: c, loadCol, weekNum: wNum });
      }
    }

    // Detalles y descanso: columnas dc+1 y dc+2 (o dc+2 y dc+3)
    const details = String(rows[r][dc+1]||"").trim();
    const rest    = String(rows[r][dc+2]||"").trim();

    cur.exercises.push({ name, details, rest, rowIdx: r, weekCols });
  }

  if (cur) days.push(cur);
  return days;
}

async function handleExport() {
  if (!state.xlsxMeta) { state.importMsg = "err:Primero importa el archivo."; render(); return; }
  const meso = state.currentMeso;
  const meta = state.mesoMeta[meso];
  if (!meta) { state.importMsg = "err:No hay datos para este mesociclo."; render(); return; }
  const { wb, rows, dayBlocks, sheetName } = meta;
  const ws = wb.Sheets[sheetName];
  dayBlocks.forEach((block, dIdx) => {
    const dayId = dIdx + 1;
    block.exercises.forEach((ex, exIdx) => {
      ex.weekCols.forEach(wc => {
        const k = meso==="1" ? `kg-${dayId}-${wc.weekNum}-${exIdx}` : `kg-${dayId}-${wc.weekNum}-${exIdx}-meso${meso}`;
        const val = state.store[k];
        if (val !== "" && val !== undefined) {
          const addr = XLSX.utils.encode_cell({ r: ex.rowIdx, c: wc.loadCol });
          ws[addr] = { v: parseFloat(val)||val, t: isNaN(parseFloat(val))?"s":"n" };
        }
      });
    });
  });
  const out = state.xlsxMeta.fileName.replace(/\.xlsx?/i, "_cargas.xlsx");
  XLSX.writeFile(wb, out);
  state.importMsg = `ok:Exportado como "${out}"`;
  render();
}

// ── kg key helper ──────────────────────────────────────────────────────────
function kgKey(dayId, weekId, exIdx) {
  const m = state.currentMeso;
  return m === "1" ? `kg-${dayId}-${weekId}-${exIdx}` : `kg-${dayId}-${weekId}-${exIdx}-meso${m}`;
}
function noteKey(dayId, weekId, exIdx) { return `note-${dayId}-${weekId}-${exIdx}-meso${state.currentMeso}`; }
function doneKey(dayId, weekId) { return `done-${dayId}-${weekId}-meso${state.currentMeso}`; }

// ── Render ─────────────────────────────────────────────────────────────────
function render() {
  const { view, activeDay, activeWeek, expanded, planData, store } = state;
  const wk = DEFAULT_WEEKS[activeWeek-1];
  const pc = PHASE_COLORS[wk.phase];
  const exercises = planData[activeDay] || [];
  const isDone = !!store[doneKey(activeDay, activeWeek)];

  const html = `
    <div class="header">
      <div>
        <span class="header-title">Training Planner</span>
        <span class="header-sub">Felipe Pacheco</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        ${syncEnabled ? `
          <button id="syncIcon" onclick="loadFromCloud()" title="Sincronizar" style="border:none;background:transparent;cursor:pointer;font-size:16px;padding:2px 4px;color:${syncStatus==='ok'?'#1D9E75':syncStatus==='error'?'#e24b4a':'#888'}">
            ${syncStatus==='ok'?'✓':syncStatus==='error'?'✕':'↻'}
          </button>
        ` : ''}
        ${state.mesoList.length > 1 ? `
          <select onchange="setMeso(this.value)" style="padding:4px 8px;border-radius:8px;border:0.5px solid #ccc;background:#f5f5f3;font-size:12px;color:#1a1a1a">
            ${state.mesoList.map((mid,i) => {
              const isLast = i === state.mesoList.length - 1;
              const label = `Meso ${mid}${isLast ? " ★" : ""}`;
              return `<option value="${mid}" ${mid===state.currentMeso?"selected":""}>${label}</option>`;
            }).join("")}
          </select>
        ` : `<span style="font-size:11px;color:#888">Meso ${state.currentMeso}</span>`}
        <div class="view-toggle">
          <button class="view-btn ${view==='workout'?'active':''}" onclick="setView('workout')">Entreno</button>
          <button class="view-btn ${view==='progress'?'active':''}" onclick="setView('progress')">Progreso</button>
          <button class="view-btn ${view==='sync'?'active':''}" onclick="setView('sync')">Sync</button>
        </div>
      </div>
    </div>

    <div class="day-nav">
      ${WEEKDAYS.map((wd,i)=>{
        const d = DEFAULT_DAYS[i];
        const name = getDayName(d.id);
        const act = d.id===activeDay;
        return `
          <button class="day-btn ${act?'active':''}"
            style="${act?`border-color:${pc};background:${pc}`:'color:#888'}"
            onclick="setDay(${d.id})">
            ${wd}<span style="opacity:0.75;font-size:10px;display:block;line-height:1.2">${name}</span>
          </button>`;
      }).join("")}
    </div>

    ${view==="workout" ? `
    <div style="display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:0.5px solid #e0dfd8;background:#f9f9f7">
      <span style="font-size:11px;color:#888;white-space:nowrap">${WEEKDAYS[activeDay-1]} —</span>
      <input type="text" value="${getDayName(activeDay).replace(/"/g,'&quot;')}"
        onchange="setDayName(${activeDay},this.value)"
        style="flex:1;padding:4px 8px;font-size:12px;border-radius:6px;border:0.5px solid #ccc;background:#fff;color:#1a1a1a"
        placeholder="Nombre del entrenamiento...">
    </div>` : ""}

    <div class="week-nav">
      ${DEFAULT_WEEKS.map(w=>{
        const wpc = PHASE_COLORS[w.phase];
        const done = !!store[`done-${activeDay}-${w.id}-meso${state.currentMeso}`] || (state.currentMeso==="1" && !!store[`done-${activeDay}-${w.id}`]);
        const act = w.id===activeWeek;
        return `<button class="week-btn" title="${w.phase}"
          style="border-color:${act?wpc:'#e0dfd8'};background:${act?wpc:done?wpc+'25':'transparent'};color:${act?'#fff':done?wpc:'#888'};font-weight:${act?500:400}"
          onclick="setWeek(${w.id})">${w.label}</button>`;
      }).join("")}
      <span class="phase-badge" style="background:${pc}22;color:${pc}">${wk.phase}</span>
    </div>

    ${view==="workout" ? renderWorkout(exercises, activeDay, activeWeek, expanded, store, pc, isDone) : ""}
    ${view==="progress" ? renderProgress(activeDay, exercises, store) : ""}
    ${view==="sync" ? renderSync() : ""}
  `;

  document.getElementById("app").innerHTML = html;
  if (view==="progress") initChart(activeDay, exercises, store);
}

function renderWorkout(exercises, dayId, weekId, expanded, store, pc, isDone) {
  const colW = ["38%","16%","12%","20%","14%"];
  const cols = ["Ejercicio","Detalles","Desc.","Prescripción","kg"];
  return `
    <div class="table-header">
      ${cols.map((c,i)=>`<span class="th" style="width:${colW[i]}">${c}</span>`).join("")}
    </div>
    ${exercises.map((ex,i)=>{
      const pres = ex.weeks[weekId-1];
      const skip = !pres || pres==="-";
      const kg = store[kgKey(dayId,weekId,i)]||"";
      const note = store[noteKey(dayId,weekId,i)]||"";
      const isExp = expanded===i;
      return `
        <div class="ex-row">
          <div class="ex-main ${skip?'skip':''} ${isExp?'expanded':''}" onclick="${skip?'':'toggleEx('+i+')'}">
            <span style="width:${colW[0]};font-size:13px">${ex.name}</span>
            <span style="width:${colW[1]};font-size:11px;color:#888">${ex.details||"—"}</span>
            <span style="width:${colW[2]};font-size:11px;color:#888">${ex.rest||"—"}</span>
            <span style="width:${colW[3]};font-size:13px;font-weight:500;color:${skip?'#888':pc}">${skip?"—":pres}</span>
            <span style="width:${colW[4]};font-size:12px">${kg?`<span style="color:${pc};font-weight:500">${kg} kg</span>`:`<span style="color:#ccc">—</span>`}</span>
          </div>
          ${isExp&&!skip?`
            <div class="ex-expand">
              <div>
                <label>Carga (kg)</label>
                <input type="number" placeholder="0" value="${kg}" style="width:80px" oninput="updKg(${dayId},${weekId},${i},this.value)">
              </div>
              <div style="flex:1">
                <label>Observaciones</label>
                <input type="text" placeholder="Notas..." value="${note.replace(/"/g,'&quot;')}" style="width:100%" oninput="updNote(${dayId},${weekId},${i},this.value)">
              </div>
            </div>
          `:""}
        </div>
      `;
    }).join("")}
    <div style="padding:1rem 16px 0">
      <button class="done-btn" style="background:${isDone?'#1D9E75':pc}" onclick="toggleDone(${dayId},${weekId})">
        ${isDone?"✓ Completada":"Marcar sesión completada"}
      </button>
    </div>
  `;
}

function renderProgress(dayId, exercises, store) {
  const sel = state.progEx;
  // Build per-meso datasets
  const datasets = state.mesoList.map((mid, mi) => {
    const data = DEFAULT_WEEKS.map(w => {
      const k = mid==="1" ? `kg-${dayId}-${w.id}-${sel}` : `kg-${dayId}-${w.id}-${sel}-meso${mid}`;
      return parseFloat(store[k])||null;
    });
    return { label:`Mesociclo ${mi+1}`, data, color: MESO_COLORS[mi%6] };
  });

  const allVals = datasets.flatMap(d=>d.data).filter(v=>v!==null);
  const hasData = allVals.length>0;
  const globalMax = hasData ? Math.max(...allVals) : 0;
  const lastMeso = datasets[datasets.length-1].data.filter(v=>v!==null);
  const firstMeso = datasets[0].data.filter(v=>v!==null);
  const lastMax = lastMeso.length ? Math.max(...lastMeso) : 0;
  const firstMax = firstMeso.length ? Math.max(...firstMeso) : 0;
  const pct = firstMax ? Math.round(((lastMax-firstMax)/firstMax)*100) : 0;
  const lastKg = lastMeso.length ? lastMeso[lastMeso.length-1] : 0;

  return `<div style="padding:1rem">
    <select style="width:100%;padding:6px 10px;border-radius:8px;border:0.5px solid #ccc;background:#f5f5f3;font-size:13px;margin-bottom:1rem" onchange="setProgEx(this.value)">
      ${exercises.map((ex,i)=>`<option value="${i}" ${i===sel?"selected":""}>${ex.name}</option>`).join("")}
    </select>
    <div class="metric-grid">
      <div class="metric-card"><div class="metric-label">Máximo histórico</div><div class="metric-val">${globalMax||"—"} ${globalMax?"kg":""}</div></div>
      <div class="metric-card"><div class="metric-label">Progreso total</div><div class="metric-val" style="color:${pct>=0?'#1D9E75':'#e24b4a'}">${hasData?(pct>=0?"+":"")+pct+"%":"—"}</div></div>
      <div class="metric-card"><div class="metric-label">Última carga</div><div class="metric-val">${lastKg||"—"} ${lastKg?"kg":""}</div></div>
    </div>
    ${!hasData ? `<p class="empty">Sin cargas registradas aún.</p>` : `
      <div class="card">
        <div class="card-header">
          <span>Progreso por mesociclo</span>
          <div class="legend">
            ${datasets.map(ds=>`
              <span class="legend-item">
                <span class="legend-line" style="background:${ds.color}"></span>
                <span class="legend-dot" style="background:${ds.color}"></span>
                ${ds.label}
              </span>`).join("")}
          </div>
        </div>
        <div style="padding:12px 16px;position:relative;height:220px">
          <canvas id="progChart" role="img" aria-label="Progreso de carga por mesociclo"></canvas>
        </div>
      </div>
      <div class="card">
        <div class="card-header"><span>Máximo por mesociclo</span></div>
        ${datasets.map((ds,mi)=>{
          const vals = ds.data.filter(v=>v!==null);
          if (!vals.length) return "";
          const mx = Math.max(...vals);
          const prev = mi>0 ? Math.max(...(datasets[mi-1].data.filter(v=>v!==null)||[0])) : null;
          const diff = prev!==null ? (mx-prev).toFixed(1) : null;
          return `<div class="hist-row">
            <div style="display:flex;align-items:center;gap:8px">
              <span class="legend-dot" style="background:${ds.color}"></span>
              <span>${ds.label}</span>
            </div>
            <div style="display:flex;align-items:center;gap:10px">
              ${diff!==null?`<span style="font-size:11px;color:${parseFloat(diff)>=0?'#1D9E75':'#e24b4a'}">${parseFloat(diff)>=0?"+":""}${diff} kg</span>`:""}
              <span style="font-weight:500">${mx} kg</span>
            </div>
          </div>`;
        }).join("")}
      </div>
    `}
  </div>`;
}

function renderSync() {
  const msg = state.importMsg;
  const isOk = msg.startsWith("ok:");
  const isErr = msg.startsWith("err:");
  const msgText = msg.replace(/^(ok|err):/,"");
  return `<div style="padding:1.25rem 16px">
    <div class="sync-card">
      <h3>1. Importar planilla del entrenador</h3>
      <p>Sube el .xlsx que te envía cada domingo. La app actualiza los ejercicios y crea un nuevo mesociclo automáticamente.</p>
      <button class="btn-upload" onclick="document.getElementById('fileIn').click()">Subir archivo .xlsx</button>
      <input type="file" id="fileIn" accept=".xlsx,.xls" style="display:none" onchange="onFile(this)">
    </div>
    <div class="sync-card">
      <h3>2. Exportar cargas al entrenador</h3>
      <p>Genera el mismo .xlsx con tus cargas ejecutadas en las columnas correspondientes, listo para enviar.</p>
      <button class="btn-export" style="background:${state.xlsxMeta?PHASE_COLORS['Acumulación']:'#ccc'};cursor:${state.xlsxMeta?'pointer':'not-allowed'}" onclick="handleExport()">
        Descargar .xlsx con cargas
      </button>
    </div>
    ${msg?`<div class="msg ${isOk?'ok':isErr?'err':''}">${msgText}</div>`:""}
    <div class="flow-note">
      <strong style="color:#1a1a1a">Flujo semanal:</strong><br>
      Lunes–Viernes: registra cargas en Entreno →<br>
      Domingo: exporta .xlsx → envíalo al entrenador →<br>
      Cuando recibes la nueva planilla: impórtala aquí.
    </div>
  </div>`;
}

function initChart(dayId, exercises, store) {
  const canvas = document.getElementById("progChart");
  if (!canvas) return;
  if (state.chart) { state.chart.destroy(); state.chart = null; }
  const sel = state.progEx;
  const datasets = state.mesoList.map((mid,mi)=>{
    const data = DEFAULT_WEEKS.map(w=>{
      const k = mid==="1"?`kg-${dayId}-${w.id}-${sel}`:`kg-${dayId}-${w.id}-${sel}-meso${mid}`;
      return parseFloat(store[k])||null;
    });
    return {
      label:`Mesociclo ${mi+1}`, data,
      borderColor: MESO_COLORS[mi%6], backgroundColor: MESO_COLORS[mi%6],
      pointBackgroundColor: data.map(v=>v!==null?MESO_COLORS[mi%6]:"transparent"),
      pointBorderColor: data.map(v=>v!==null?MESO_COLORS[mi%6]:"transparent"),
      pointRadius: data.map(v=>v!==null?6:0), pointHoverRadius:9,
      borderWidth:2, borderDash: MESO_DASHES[mi%6], spanGaps:false, tension:0.3,
    };
  });
  state.chart = new Chart(canvas, {
    type:"line",
    data:{ labels: DEFAULT_WEEKS.map(w=>w.label), datasets },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false}, tooltip:{ filter:i=>i.raw!==null, callbacks:{label:ctx=>`${ctx.dataset.label}: ${ctx.raw} kg`} } },
      scales:{
        x:{ grid:{display:false}, ticks:{color:"#888",font:{size:11},autoSkip:false} },
        y:{ grid:{color:"rgba(0,0,0,0.05)"}, ticks:{color:"#888",font:{size:11},callback:v=>v+" kg"}, beginAtZero:false }
      }
    }
  });
}

// ── Event handlers ─────────────────────────────────────────────────────────
function setView(v) { state.view=v; state.importMsg=""; render(); }
function setDay(d) { state.activeDay=d; state.expanded=null; render(); }
function setWeek(w) { state.activeWeek=w; state.expanded=null; render(); }
function setMeso(mid) {
  state.currentMeso = mid;
  const meta = state.mesoMeta[mid];
  if (meta && meta.planData) state.planData = meta.planData;
  state.expanded = null;
  render();
}
function toggleEx(i) { state.expanded = state.expanded===i ? null : i; render(); }
function updKg(d,w,i,v) { state.store[kgKey(d,w,i)]=v; saveStore(); }
function updNote(d,w,i,v) { state.store[noteKey(d,w,i)]=v; saveStore(); }
function toggleDone(d,w) { const k=doneKey(d,w); state.store[k]=!state.store[k]; saveStore(); render(); }
function setProgEx(v) { state.progEx=+v; if(state.chart){state.chart.destroy();state.chart=null;} render(); }
function onFile(input) { if(input.files[0]) handleImport(input.files[0]); }

render();
</script>
</body>
</html>
